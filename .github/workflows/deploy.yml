name: Deploy to Apps Script

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'appsscript.json'
      - '.github/workflows/deploy.yml'
  # Lets a failed deploy be re-run without an empty commit.
  workflow_dispatch:

# Needed by the failure-notification step below, which opens an issue.
permissions:
  contents: read
  issues: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Run automated checks
        run: npm run check

      # Pinned deliberately. This was previously `npm install -g @google/clasp`,
      # which silently follows major versions — and clasp 3.x changed both the
      # credential handling and several command names. A backend deploy that
      # quietly stops working looks identical to one that worked (the code is in
      # git either way), so the version that CI runs must not drift on its own.
      # Keep this in sync with whatever `clasp --version` reports locally.
      - name: Install clasp
        run: npm install -g @google/clasp@3.3.0

      - name: Write clasp credentials
        env:
          CLASP_TOKEN: ${{ secrets.CLASP_TOKEN }}
        run: |
          if [ -z "$CLASP_TOKEN" ]; then
            echo "::error::CLASP_TOKEN secret is empty or unset."
            exit 1
          fi
          printf '%s' "$CLASP_TOKEN" > ~/.clasprc.json
          if ! grep -q 'refresh_token\|refreshToken' ~/.clasprc.json; then
            echo "::error::CLASP_TOKEN does not look like a valid ~/.clasprc.json (no refresh token found)."
            echo "::error::Regenerate it locally with 'clasp login', then copy ~/.clasprc.json into the secret."
            exit 1
          fi

      - name: Push to Apps Script
        run: clasp push --force

      # clasp push only updates source; the live /exec URL serves a versioned
      # deployment that must be re-pointed at a new version each time.
      - name: Deploy new version to live web app
        run: clasp deploy -i "${{ secrets.CLASP_DEPLOYMENT_ID }}" -d "CI deploy ${GITHUB_SHA::7}"

      # The failure this guards against has actually happened: the push
      # succeeded, the deploy silently did not, and the code looked live in git
      # while the old version kept serving. Confirm the live deployment now
      # carries this commit's description before calling the job green.
      - name: Verify the deployment actually moved
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          DEPLOYMENTS="$(clasp list-deployments)"
          echo "$DEPLOYMENTS"
          if ! echo "$DEPLOYMENTS" | grep -q "CI deploy $SHORT_SHA"; then
            echo "::error::Live deployment does not reference $SHORT_SHA — the deploy did not take effect."
            exit 1
          fi
          echo "Verified: live deployment is serving CI deploy $SHORT_SHA"

      - name: Smoke test live backend
        run: |
          SCRIPT_URL="$(sed -n "s/^export const SCRIPT_URL = '\([^']*\)';/\1/p" js/config.js)"
          if [ -z "$SCRIPT_URL" ]; then
            echo "::error::Could not read SCRIPT_URL from js/config.js"
            exit 1
          fi
          curl --fail --location --silent --show-error --retry 4 --retry-delay 3 \
            "$SCRIPT_URL" | grep -q "SWS Production Calendar"

      # A red run that nobody looks at is the same as no run at all — this is
      # exactly how commit 1c318d0 shipped a frontend whose backend never
      # deployed. An issue shows up in normal GitHub notifications rather than
      # only on a tab someone has to remember to check. Reuses one open issue
      # instead of filing a new one per failed attempt.
      - name: Open an issue if the deploy failed
        if: failure()
        uses: actions/github-script@v8
        with:
          script: |
            const label = 'deploy-failure';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const sha = context.sha.substring(0, 7);
            const body = [
              `**The backend deploy failed for \`${sha}\`.**`,
              '',
              `Run: ${runUrl}`,
              '',
              'The frontend deploys from a separate workflow and may have succeeded,',
              'which means production could be running new frontend code against an',
              'older backend. Check before assuming this is cosmetic.',
              '',
              'Manual recovery:',
              '```bash',
              'clasp push --force',
              'clasp list-deployments   # copy the non-@HEAD id',
              'clasp deploy -i <ID> -d "manual deploy ' + sha + '"',
              '```',
            ].join('\n');

            try {
              await github.rest.issues.createLabel({
                ...context.repo, name: label, color: 'b60205',
                description: 'Automated: an Apps Script deploy failed',
              });
            } catch (err) { /* already exists */ }

            const { data: open } = await github.rest.issues.listForRepo({
              ...context.repo, state: 'open', labels: label,
            });

            if (open.length) {
              await github.rest.issues.createComment({
                ...context.repo, issue_number: open[0].number, body,
              });
            } else {
              await github.rest.issues.create({
                ...context.repo,
                title: 'Apps Script deploy is failing',
                labels: [label],
                body,
              });
            }
