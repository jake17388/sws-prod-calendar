name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Test and build public artifact
        run: |
          npm run check
          npm run build:pages

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          # auto-enable Pages on first run so no manual Settings step is needed
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Smoke test deployed frontend
        run: |
          curl --fail --location --silent --show-error --retry 4 --retry-delay 3 \
            "${{ steps.deployment.outputs.page_url }}" | grep -q "SWS Production Calendar"
